# orc-notify-web — nginx config for Captain deployment.
#
# Serves the built Vite SPA from /usr/share/nginx/html and reverse-proxies
# the FastAPI endpoints to the backend Captain app `orc-notify` over the
# swarm overlay network (DNS name resolves in-cluster).
#
# Backend host: srv-captain--orc-notify:8000
# (Captain prefixes the app name with `srv-captain--` for in-network DNS.)
#
# Phase 4.1: added v2 ntfy-style topic routes (POST /<topic> for publish,
# GET /<topic>/{sse,json,raw,auth} for subscribe). Bare GET /<topic> stays
# as SPA fallback (React Router owns client-side routing).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — non-asset paths serve index.html so React Router can
    # own client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache static assets (vite emits hashed filenames under /assets/).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Backend reverse-proxy — REST API (auth + admin endpoints).
    location ~ ^/(auth|api|v1)/ {
        proxy_pass http://srv-captain--orc-notify:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # SSE-friendly: disable buffering, long timeouts.
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Phase 4.1 — v2 topic subscriptions (SSE/JSON/raw/auth). Match the
    # topic-name pattern ^[A-Za-z0-9_\-]+$ (validated server-side in
    # app/models.py Topic.name) plus one of the ntfy subscribe suffixes.
    location ~ "^/[A-Za-z0-9_\-]+/(sse|json|raw|auth)$" {
        proxy_pass http://srv-captain--orc-notify:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # SSE streams are long-lived — disable buffering + use long timeouts.
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Phase 4.1 — v2 publish: POST /<topic> goes to the api; GET on the
    # same path stays as SPA fallback so React Router can render topic pages.
    # `proxy_set_header` directives MUST live at location scope (nginx:alpine
    # rejects them inside `if` blocks). proxy_pass stays inside `if` so GET
    # requests bypass the upstream and fall through to try_files → SPA.
    location ~ "^/[A-Za-z0-9_\-]+$" {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        if ($request_method = POST) {
            proxy_pass http://srv-captain--orc-notify:8000;
        }
        try_files $uri $uri/ /index.html;
    }

    # ntfy wildcard topic for global feeds (mirrors ntfy.sh's `/-`).
    location = "/-/" {
        proxy_pass http://srv-captain--orc-notify:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # Healthz exposed for Captain's default healthcheck pattern.
    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}