{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card">
  <h1>Sign in</h1>
  <form hx-post="/auth/login" hx-ext="json-enc" hx-swap="none" hx-on::after-request="window.location='/dashboard'">
    <label>Email <input name="email" type="email" required autofocus></label>
    <label>Password <input name="password" type="password" required minlength="1"></label>
    <button type="submit">Sign in</button>
  </form>
  <p class="muted">No account? <a href="/register">Register</a></p>
</div>
{% endblock %}
