<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>orc-notify</title>
    <!--
      Pre-paint script: applies persisted theme before React mounts to avoid FOUC.
      Reads localStorage 'app-theme' (light | dark | system), resolves to one of
      light/dark, and sets the matching class on <html> for shadcn's `.dark` selector.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('app-theme');
          var resolved;
          if (saved === 'system' || saved == null) {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          } else {
            resolved = saved;
          }
          if (resolved === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.dataset.appTheme = resolved;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
