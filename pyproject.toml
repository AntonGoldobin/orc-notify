[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orc-notify"
version = "0.1.0"
description = "Multi-tenant notification SaaS — FastAPI + Postgres + SSE"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anton Goldobin" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    # Alembic runs migrations via sync driver — psycopg2 is the standard choice.
    "psycopg2-binary>=2.9",
    "alembic>=1.13.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "jinja2>=3.1.4",
    "sse-starlette>=2.1.3",
    "httpx>=0.27.0",
    "orjson>=3.10.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.2.0",
    "cryptography>=42.0.0",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
