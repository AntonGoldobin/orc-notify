name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Docker requires lowercase repo names. GitHub repos keep their
  # original case in `${{ github.repository }}` (e.g. `AntonGoldobin/orc-notify`)
  # but Docker daemon rejects mixed-case on pull — force lowercase so
  # CapRover can resolve the image from ghcr.io.
  IMAGE_NAME: ${{ github.repository_owner_lowercase }}/orc-notify

jobs:
  build:
    name: build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # Lightweight smoke test on PRs — start the container, hit /healthz,
  # confirm 200. Pulled from `app.main` only.
  smoke:
    name: smoke (/healthz)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: orc_notify
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orc_notify
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orc_notify"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://orc_notify:postgres@localhost:5432/orc_notify
      JWT_SECRET: ci-jwt-secret-only-used-in-workflow
      WEBHOOK_SECRET_KEY: YWJjZGVmZ2hpamtsbW5vcDpzdGF0aWNrZXktZm9yLWNpLW9ubHk=
      PUBLIC_BASE_URL: http://localhost:8000
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t orc-notify:ci .
      - name: Start container
        run: |
          docker run -d --name orc-notify-ci \
            -e DATABASE_URL="$DATABASE_URL" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e WEBHOOK_SECRET_KEY="$WEBHOOK_SECRET_KEY" \
            -e PUBLIC_BASE_URL="$PUBLIC_BASE_URL" \
            -e COOKIE_SECURE="$COOKIE_SECURE" \
            -p 8000:8000 \
            orc-notify:ci
      - name: Wait for /healthz
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/healthz; then
              echo "✓ /healthz up after $i tries"
              exit 0
            fi
            sleep 2
          done
          docker logs orc-notify-ci
          exit 1