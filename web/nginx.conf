# orc-notify-web — nginx config for Captain deployment.
#
# Serves the built Vite SPA from /usr/share/nginx/html and reverse-proxies
# the FastAPI endpoints (/auth, /api, /v1) to the backend Captain app
# `orc-notify` over the swarm overlay network (DNS name resolves in-cluster).
#
# Backend host: srv-captain--orc-notify:8000
# (Captain prefixes the app name with `srv-captain--` for in-network DNS.)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every non-asset path serves index.html so React Router
    # can own client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache static assets (vite emits hashed filenames under /assets/).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Backend reverse-proxy. Order matters: /auth, /api, /v1 are exact
    # prefixes in the FastAPI app (see app/main.py router includes).
    location ~ ^/(auth|api|v1)/ {
        proxy_pass http://srv-captain--orc-notify:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # SSE-friendly: disable buffering, long timeouts.
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Healthz exposed for Captain's default healthcheck pattern.
    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}